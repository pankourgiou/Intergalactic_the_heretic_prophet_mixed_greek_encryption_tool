<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ελληνικό Κρυπτόγραμμα · Glyph Cipher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #07060c;
    --bg2: #0d0a18;
    --panel: #100c1c;
    --line: #2a2140;
    --cyan: #6fe3ff;
    --cyan-dim: #3aa8c4;
    --magenta: #ff4fa3;
    --violet: #7b5cff;
    --ink: #d9e6ee;
    --ink-dim: #8791a8;
    --font-display: 'Space Grotesk', sans-serif;
    --font-mono: 'Space Mono', monospace;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    min-height:100%;
    background: radial-gradient(120% 90% at 50% -10%, #1a1030 0%, var(--bg) 55%, #030208 100%);
    color: var(--ink);
    font-family: var(--font-display);
  }

  body{
    padding: 56px 20px 80px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.018) 0px,
      rgba(255,255,255,0.018) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
  }

  .wrap{
    position:relative; z-index:1;
    width:100%;
    max-width: 760px;
  }

  /* ---------- Header ---------- */
  header{
    text-align:center;
    margin-bottom: 42px;
  }

  .eyebrow{
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--ink-dim);
    margin: 0 0 14px;
  }

  h1{
    font-size: clamp(32px, 6vw, 48px);
    line-height: 1.05;
    margin: 0 0 16px;
    font-weight: 700;
    color: #eaf6ff;
    text-shadow:
      0 0 6px rgba(111,227,255,0.55),
      0 0 22px rgba(111,227,255,0.35),
      0 0 48px rgba(123,92,255,0.25);
  }

  header p{
    max-width: 520px;
    margin: 0 auto;
    color: var(--ink-dim);
    font-size: 15px;
    line-height: 1.6;
  }

  header p b{ color: var(--cyan); font-weight: 600; }

  /* ---------- Panels ---------- */
  .panel{
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)), var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 26px;
    margin-bottom: 28px;
    box-shadow: 0 0 0 1px rgba(123,92,255,0.04) inset, 0 18px 40px -24px rgba(0,0,0,0.8);
  }

  .panel-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap: 12px;
    margin-bottom: 18px;
  }

  .panel-title{
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.1em;
    color: var(--cyan);
    margin:0;
  }

  .panel-sub{
    font-size: 12px;
    color: var(--ink-dim);
    margin:0;
  }

  /* ---------- Key grid ---------- */
  .key-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
    gap: 8px;
  }

  .key-tile{
    background: #0a0716;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 4px 6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }

  .key-tile img{
    width: 30px; height:30px;
    filter: drop-shadow(0 0 4px rgba(111,227,255,0.55));
  }

  .key-tile span{
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: 0.05em;
  }

  /* ---------- Input ---------- */
  textarea{
    width:100%;
    min-height: 96px;
    resize: vertical;
    background: #0a0716;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 14px;
    line-height: 1.5;
    outline: none;
  }

  textarea:focus{
    border-color: var(--cyan-dim);
    box-shadow: 0 0 0 3px rgba(111,227,255,0.12);
  }

  .row{
    display:flex;
    gap:10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  button{
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.06em;
    padding: 11px 18px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #0a0716;
    color: var(--ink);
    cursor:pointer;
    transition: border-color .15s ease, color .15s ease, box-shadow .15s ease;
  }

  button.primary{
    color: #07060c;
    background: linear-gradient(135deg, var(--cyan), #9fb4ff);
    border: none;
    font-weight: 700;
  }

  button.primary:hover{ box-shadow: 0 0 22px rgba(111,227,255,0.45); }
  button:not(.primary):hover{ border-color: var(--cyan-dim); color: var(--cyan); }

  button:disabled{ opacity: 0.4; cursor: not-allowed; }

  /* ---------- Output ---------- */
  #output-stage{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
      radial-gradient(60% 90% at 50% 20%, rgba(123,92,255,0.16), transparent 60%),
      #060410;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    overflow-x:auto;
  }

  #outputCanvas{
    display:block;
    max-width:100%;
  }

  .empty-note{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-dim);
    padding: 30px 10px;
    text-align:center;
  }

  footer{
    margin-top: 6px;
    text-align:center;
    font-size: 11px;
    color: #4d5568;
    font-family: var(--font-mono);
  }

  @media (max-width: 520px){
    .panel{ padding: 18px; }
    .key-tile img{ width:24px; height:24px; }
  }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="wrap">

  <header>
    <p class="eyebrow">ΚΡΥΠΤΟΓΡΑΦΗΣΗ · 24 ΣΥΜΒΟΛΑ</p>
    <h1>Ελληνικό Κρυπτόγραμμα</h1>
    <p>Γράψε ένα μήνυμα και μεταδίδεται <b>γράμμα προς γράμμα</b> σε γλύφους. Τόνοι, διαλυτικά και τελικό ς αναγνωρίζονται αυτόματα.</p>
  </header>

  <section class="panel" id="key-panel">
    <div class="panel-head">
      <p class="panel-title">ΚΛΕΙΔΙ</p>
      <p class="panel-sub">Α&ndash;Ω</p>
    </div>
    <div class="key-grid" id="keyGrid"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <p class="panel-title">ΜΗΝΥΜΑ</p>
      <p class="panel-sub" id="charCount">0 χαρακτήρες</p>
    </div>
    <textarea id="messageInput" placeholder="Γράψε το μήνυμά σου εδώ…" maxlength="240"></textarea>
    <div class="row">
      <button class="primary" id="encryptBtn">Κρυπτογράφηση</button>
      <button id="downloadBtn" disabled>Λήψη .PNG</button>
      <button id="clearBtn">Καθαρισμός</button>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <p class="panel-title">ΕΞΟΔΟΣ</p>
      <p class="panel-sub">εικόνα γλύφων</p>
    </div>
    <div id="output-stage">
      <div class="empty-note" id="emptyNote">Κρυπτογράφησε ένα μήνυμα για να εμφανιστεί εδώ.</div>
      <canvas id="outputCanvas" style="display:none;"></canvas>
    </div>
  </section>

  <footer> &nbsp;·&nbsp; </footer>

</div>

/* ---------- Greek normalisation (accents, diaeresis, final sigma) ---------- */
function normGreek(ch){
  let c = ch.normalize('NFD').replace(/[\u0300-\u036f\u0342\u0345]/g, '');
  c = c.toUpperCase();
  if(c === 'Σ' || c === 'ς' || c === 'Ϲ') c = 'Σ';
  return c;
}

/* ---------- Build cipher key panel ---------- */
const keyGrid = document.getElementById('keyGrid');
Object.keys(GLYPHS).forEach(letter => {
  const tile = document.createElement('div');
  tile.className = 'key-tile';
  const img = document.createElement('img');
  img.src = GLYPHS[letter];
  img.alt = letter;
  const span = document.createElement('span');
  span.textContent = letter + ' ' + letter.toLowerCase();
  tile.appendChild(img);
  tile.appendChild(span);
  keyGrid.appendChild(tile);
});

/* ---------- Input handling ---------- */
const input = document.getElementById('messageInput');
const charCount = document.getElementById('charCount');
const encryptBtn = document.getElementById('encryptBtn');
const downloadBtn = document.getElementById('downloadBtn');
const clearBtn = document.getElementById('clearBtn');
const canvas = document.getElementById('outputCanvas');
const ctx = canvas.getContext('2d');
const emptyNote = document.getElementById('emptyNote');

input.addEventListener('input', () => {
  charCount.textContent = input.value.length + ' χαρακτήρες';
});

clearBtn.addEventListener('click', () => {
  input.value = '';
  charCount.textContent = '0 χαρακτήρες';
  canvas.style.display = 'none';
  emptyNote.style.display = 'block';
  downloadBtn.disabled = true;
  input.focus();
});

/* ---------- Glyph image cache ---------- */
const imgCache = {};
function getImg(letter){
  if(imgCache[letter]) return imgCache[letter];
  const im = new Image();
  im.src = GLYPHS[letter];
  imgCache[letter] = im;
  return im;
}
// preload
Object.keys(GLYPHS).forEach(getImg);

/* ---------- Rendering ---------- */
const BOX = 64;          // glyph slot size
const GAP = 6;           // gap between slots
const LINE_GAP = 14;
const PAD = 28;
const MAX_WIDTH = 760;

function layout(text){
  const perLine = Math.max(1, Math.floor((MAX_WIDTH - PAD*2 + GAP) / (BOX + GAP)));
  const chars = text.split('');
  const lines = [];
  let current = [];
  chars.forEach(ch => {
    if(ch === '\n'){
      lines.push(current);
      current = [];
      return;
    }
    current.push(ch);
    if(current.length >= perLine){
      lines.push(current);
      current = [];
    }
  });
  if(current.length) lines.push(current);
  if(lines.length === 0) lines.push([]);
  return lines;
}

function drawSlot(ch, x, y){
  // background slot plate
  ctx.save();
  ctx.beginPath();
  const r = 10;
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+BOX, y, x+BOX, y+BOX, r);
  ctx.arcTo(x+BOX, y+BOX, x, y+BOX, r);
  ctx.arcTo(x, y+BOX, x, y, r);
  ctx.arcTo(x, y, x+BOX, y, r);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.025)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(123,92,255,0.18)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  const upper = normGreek(ch);
  if(GLYPHS[upper]){
    const im = getImg(upper);
    const pad = 9;
    ctx.save();
    ctx.shadowColor = 'rgba(111,227,255,0.65)';
    ctx.shadowBlur = 14;
    ctx.drawImage(im, x+pad, y+pad, BOX-pad*2, BOX-pad*2);
    ctx.restore();
  } else if(ch.trim() === ''){
    // space: leave plate empty
  } else {
    ctx.save();
    ctx.fillStyle = 'rgba(217,230,238,0.55)';
    ctx.font = '600 20px "Space Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ch, x+BOX/2, y+BOX/2+1);
    ctx.restore();
  }
}

function render(text){
  if(!text || !text.trim()){
    canvas.style.display = 'none';
    emptyNote.style.display = 'block';
    downloadBtn.disabled = true;
    return;
  }

  const lines = layout(text);
  const rowWidthPx = (lineArr) => lineArr.length * BOX + Math.max(0, lineArr.length-1)*GAP;
  const widest = Math.max(...lines.map(rowWidthPx), BOX);
  const canvasW = widest + PAD*2;
  const canvasH = lines.length * BOX + Math.max(0, lines.length-1)*LINE_GAP + PAD*2 + 46;

  const scale = window.devicePixelRatio || 1;
  canvas.width = canvasW * scale;
  canvas.height = canvasH * scale;
  canvas.style.width = canvasW + 'px';
  canvas.style.height = canvasH + 'px';
  ctx.setTransform(scale,0,0,scale,0,0);

  // background plaque
  const grad = ctx.createRadialGradient(canvasW/2, canvasH*0.25, 10, canvasW/2, canvasH*0.4, canvasW*0.8);
  grad.addColorStop(0, '#1a1030');
  grad.addColorStop(1, '#07060c');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,canvasW,canvasH);
  ctx.strokeStyle = 'rgba(111,227,255,0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5,0.5,canvasW-1,canvasH-1);

  lines.forEach((lineArr, li) => {
    const lineWidth = rowWidthPx(lineArr);
    let x = (canvasW - lineWidth) / 2;
    const y = PAD + li * (BOX + LINE_GAP);
    lineArr.forEach(ch => {
      drawSlot(ch, x, y);
      x += BOX + GAP;
    });
  });

  // caption
  ctx.save();
  ctx.font = '11px "Space Mono", monospace';
  ctx.fillStyle = 'rgba(135,145,168,0.8)';
  ctx.textAlign = 'center';
  ctx.fillText('ΕΛΛΗΝΙΚΟ ΚΡΥΠΤΟΓΡΑΜΜΑ', canvasW/2, canvasH - 18);
  ctx.restore();

  canvas.style.display = 'block';
  emptyNote.style.display = 'none';
  downloadBtn.disabled = false;
}

encryptBtn.addEventListener('click', () => render(input.value));
input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
    render(input.value);
  }
});

downloadBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  const stamp = new Date().toISOString().replace(/[:.]/g,'-');
  link.download = 'intergalactic-cipher-' + stamp + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});
</script>
